name: duck_etl
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytest
  - pytest-timeout
  - pytest-order
  - pytest-sugar
  - pytest-pythonpath
  - polars
  - pandas
  - pyarrow
  - requests
  - pip:
    - duckdb==1.4.1
    - sqlmesh
    - cuallee==0.15.3
    - sqlframe
    - ibis-framework[duckdb]
    - psycopg2-binary
    - tqdm
    - boto
    - pyyaml
    - faker
    - jupysql
    - duckdb-engine
